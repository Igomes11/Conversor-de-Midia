<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Mídia Assíncrono</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #ffffff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 550px; padding: 30px; }
        h1 { font-size: 1.5rem; margin-bottom: 20px; color: #1a202c; text-align: center; }
        .section { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #e2e8f0; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: #4a5568; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e0; border-radius: 6px; margin-bottom: 15px; font-size: 0.95rem; outline: none; }
        button { width: 100%; background-color: #3182ce; color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background-color: #2b6cb0; }

        .status-box { background-color: #edf2f7; border-left: 4px solid #cbd5e0; padding: 15px; border-radius: 4px; margin-top: 15px; display: none; }
        .progress-container { width: 100%; background-color: #e2e8f0; border-radius: 8px; height: 18px; margin: 10px 0; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background-color: #3182ce; transition: width 0.4s ease; text-align: center; color: white; font-size: 0.75rem; line-height: 18px; font-weight: bold; }
        
        .download-btn { display: inline-block; margin-top: 10px; padding: 8px 16px; background-color: #48bb78; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; text-align: center; }

        /* ESTILOS DO MODAL DE ALERTA */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: #fff; padding: 25px; border-radius: 10px;
            max-width: 420px; width: 90%; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); transform: translateY(-20px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-icon { font-size: 2.5rem; margin-bottom: 10px; color: #e53e3e; }
        .modal-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: #2d3748; }
        .modal-body { font-size: 0.95rem; color: #718096; margin-bottom: 20px; line-height: 1.4; }
        .modal-close-btn {
            background-color: #e53e3e; color: white; border: none;
            padding: 10px 20px; font-weight: bold; border-radius: 6px;
            cursor: pointer; width: 100%;
        }
        .modal-close-btn:hover { background-color: #c53030; }
    </style>
</head>
<body>

<div class="container">
    <h1>Conversor de Mídia Assíncrono</h1>

    <div class="section">
        <form id="uploadForm">
            <label for="file">Ficheiro (Vídeo, Áudio ou Imagem):</label>
            <input type="file" id="file" name="file" required>

            <label for="target_format">Formato de Destino:</label>
            <select id="target_format" name="target_format" required>
                <optgroup label="Áudio">
                    <option value="mp3">MP3</option>
                    <option value="wav">WAV</option>
                </optgroup>
                <optgroup label="Vídeo">
                    <option value="mp4">MP4</option>
                    <option value="avi">AVI</option>
                </optgroup>
                <optgroup label="Imagem">
                    <option value="jpg">JPG</option>
                    <option value="png">PNG</option>
                </optgroup>
            </select>

            <label for="notify_email">E-mail para Notificação:</label>
            <input type="email" id="notify_email" name="notify_email" placeholder="seu@email.com" required>

            <button type="submit" id="submitBtn">Enviar para Conversão</button>
        </form>
    </div>

    <div class="section">
        <label for="searchJobId">Consultar por Job ID:</label>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="searchJobId" placeholder="Cole o jobId aqui..." style="margin-bottom: 0;">
            <button type="button" id="searchBtn" style="width: auto; padding: 0 16px;">Buscar</button>
        </div>

        <div id="statusContainer" class="status-box">
            <p><strong>Job ID:</strong> <span id="lblJobId">-</span></p>
            <p><strong>Status:</strong> <span id="lblStatus">-</span></p>
            
            <div class="progress-container">
                <div id="progressBar" class="progress-bar">0%</div>
            </div>

            <div id="downloadContainer" style="display: none;">
                <a id="btnDownload" href="#" target="_blank" class="download-btn">Baixar Ficheiro Convertido</a>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DE ALERTA DE CONVERSÃO INVÁLIDA -->
<div id="alertModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-title">Conversão Incompatível</div>
        <div id="modalMessage" class="modal-body">
            Não é possível converter esta mídia para o formato selecionado.
        </div>
        <button type="button" class="modal-close-btn" onclick="fecharModal()">Entendi</button>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8000';
    let eventSource = null;

    const CATEGORIAS = {
        IMAGEM: ['jpg', 'jpeg', 'png', 'webp', 'bmp', 'gif'],
        AUDIO: ['mp3', 'wav'],
        VIDEO: ['mp4', 'avi', 'mkv', 'mov']
    };

    function exibirModal(mensagem) {
        document.getElementById('modalMessage').innerText = mensagem;
        document.getElementById('alertModal').classList.add('active');
    }

    function fecharModal() {
        document.getElementById('alertModal').classList.remove('active');
    }

    function validarCompatibilidade(extensaoOrigem, formatoDestino) {
        extensaoOrigem = extensaoOrigem.toLowerCase();
        formatoDestino = formatoDestino.toLowerCase();

        const eImagem = CATEGORIAS.IMAGEM.includes(extensaoOrigem);
        const eAudio = CATEGORIAS.AUDIO.includes(extensaoOrigem);
        const eVideo = CATEGORIAS.VIDEO.includes(extensaoOrigem);

        const destinoImagem = CATEGORIAS.IMAGEM.includes(formatoDestino);
        const destinoAudio = CATEGORIAS.AUDIO.includes(formatoDestino);
        const destinoVideo = CATEGORIAS.VIDEO.includes(formatoDestino);

        if (eImagem && (destinoAudio || destinoVideo)) {
            return `Não é possível converter uma Imagem (.${extensaoOrigem.toUpperCase()}) em Áudio ou Vídeo (.${formatoDestino.toUpperCase()}). Selecione um formato de imagem como JPG ou PNG.`;
        }

        if ((eAudio || eVideo) && destinoImagem) {
            return `Não é possível converter uma Mídia de Áudio/Vídeo (.${extensaoOrigem.toUpperCase()}) para um formato de Imagem (.${formatoDestino.toUpperCase()}).`;
        }

        return null;
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('file');
        const targetFormat = document.getElementById('target_format').value;

        if (!fileInput.files[0]) return exibirModal('Por favor, selecione um ficheiro local.');

        const file = fileInput.files[0];
        const extensao = file.name.split('.').pop();

        const erroCompatibilidade = validarCompatibilidade(extensao, targetFormat);
        if (erroCompatibilidade) {
            return exibirModal(erroCompatibilidade);
        }

        const formData = new FormData();
        formData.append('file', file);
        formData.append('target_format', targetFormat);
        formData.append('notify_email', document.getElementById('notify_email').value);

        try {
            const response = await fetch(`${API_URL}/upload`, { method: 'POST', body: formData });
            const data = await response.json();
            
            if (response.ok) {
                document.getElementById('searchJobId').value = data.jobId;
                conectarSSE(data.jobId);
            } else {
                exibirModal(`Erro na API: ${data.detail || 'Falha ao submeter pedido.'}`);
            }
        } catch (err) {
            exibirModal('Não foi possível conectar à API do servidor.');
        }
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
        const jobId = document.getElementById('searchJobId').value.trim();
        if (jobId) conectarSSE(jobId);
    });

    function conectarSSE(jobId) {
        if (eventSource) eventSource.close();

        const statusContainer = document.getElementById('statusContainer');
        const lblJobId = document.getElementById('lblJobId');
        const lblStatus = document.getElementById('lblStatus');
        const progressBar = document.getElementById('progressBar');
        const downloadContainer = document.getElementById('downloadContainer');
        const btnDownload = document.getElementById('btnDownload');

        statusContainer.style.display = 'block';
        lblJobId.innerText = jobId;

        eventSource = new EventSource(`${API_URL}/jobs/${jobId}/events`);

        eventSource.onmessage = (event) => {
            const data = JSON.parse(event.data);
            lblStatus.innerText = data.status;
            
            const progress = data.progress || 0;
            progressBar.style.width = `${progress}%`;
            progressBar.innerText = `${progress}%`;

            if (data.status === 'CONCLUIDO') {
                progressBar.style.width = '100%';
                progressBar.innerText = '100%';
                downloadContainer.style.display = 'block';
                btnDownload.href = data.output_url;
                eventSource.close();
            } else if (data.status === 'ERRO') {
                progressBar.style.backgroundColor = '#f56565';
                eventSource.close();
            }
        };
    }
</script>
</body>
</html>
